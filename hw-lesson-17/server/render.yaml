services:
  - type: web
    name: emr-auth-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false  # Будет установлен после деплоя фронта
      - key: JWT_SECRET
        generateValue: true
